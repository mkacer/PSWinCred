name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # No usage telemetry from the .NET CLI or Microsoft.Testing.Platform
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Native unit tests (net462 and net10.0)
        run: dotnet test --solution WinCred.slnx --configuration Release --report-trx --results-directory out/TestResults

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Test results (native)
          path: out/TestResults

      - name: Install pinned tools and verify signatures
        shell: pwsh
        run: ./tools/Install-Tools.ps1

      - name: PSScriptAnalyzer
        shell: pwsh
        run: ./tools/Invoke-ScriptAnalysis.ps1

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: WinCred
          path: out/WinCred

  test:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported: Windows PowerShell 5.1, the supported LTS releases of PowerShell 7, and any
        # supported non-LTS release newer than the latest LTS. 7.4 LTS ends 10 Nov 2026; remove it then.
        # 7.6 LTS is supported until 14 Nov 2028.
        include:
          - name: Windows PowerShell 5.1
            version: ''
          - name: PowerShell 7.4
            version: 7.4.20
          - name: PowerShell 7.6
            version: 7.6.6
    name: Pester (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WinCred
          path: out/WinCred

      - name: Install Pester and verify its signature
        shell: pwsh
        run: ./tools/Install-Tools.ps1 -Name Pester

      - name: Install PowerShell ${{ matrix.version }}
        if: matrix.version != ''
        shell: pwsh
        env:
          PWSH_VERSION: ${{ matrix.version }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "PowerShell-$env:PWSH_VERSION.zip"
          $dir = Join-Path $env:RUNNER_TEMP "PowerShell-$env:PWSH_VERSION"
          Invoke-WebRequest "https://github.com/PowerShell/PowerShell/releases/download/v$env:PWSH_VERSION/PowerShell-$env:PWSH_VERSION-win-x64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir
          $exe = Join-Path $dir 'pwsh.exe'
          $signature = Get-AuthenticodeSignature -FilePath $exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notlike 'CN=Microsoft Corporation, *') {
              throw "pwsh.exe $env:PWSH_VERSION has signature status '$($signature.Status)' from '$($signature.SignerCertificate.Subject)'."
          }
          "PWSH_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Pester tests
        shell: pwsh
        run: |
          $exe = if ($env:PWSH_EXE) { $env:PWSH_EXE } else { 'powershell.exe' }
          & $exe -NoProfile -NonInteractive -File ./tests/Invoke-Tests.ps1
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Test results (${{ matrix.name }})
          path: out/TestResults

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: WinCred
          path: WinCred

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path WinCred -DestinationPath WinCred.zip
          gh release create $env:TAG WinCred.zip --repo $env:GITHUB_REPOSITORY --draft --title $env:TAG
