name: CI

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Unit tests (net462 and net10.0)
        run: dotnet test TUN.CredentialManager.slnx --configuration Release

      - name: Install platyPS
        shell: pwsh
        run: Install-Module platyPS -RequiredVersion 0.14.2 -Scope CurrentUser -Force

      - name: Build module
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Smoke tests (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Smoke.ps1

      - name: Smoke tests (PowerShell 7)
        shell: pwsh
        run: ./tests/Smoke.ps1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TUN.CredentialManager
          path: out/TUN.CredentialManager

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: TUN.CredentialManager
          path: TUN.CredentialManager

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path TUN.CredentialManager -DestinationPath TUN.CredentialManager.zip
          gh release create $env:TAG TUN.CredentialManager.zip --repo $env:GITHUB_REPOSITORY --draft --title $env:TAG
