# Keeps the commit-pinned GitHub Actions and the NuGet packages current.
# The PowerShell Gallery tools in tools/tools.psd1 are not covered; update them by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let new releases age before proposing them
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /src/WinCred
      - /tests/WinCred.Native.Tests
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      test-frameworks:
        patterns: ['MSTest*', 'Microsoft.Testing.*']
